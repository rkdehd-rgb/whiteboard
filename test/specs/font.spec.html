<!DOCTYPE html><meta charset="utf-8"><title>font 主线</title>
<style>
  body{font:13px/1.6 system-ui,"Microsoft YaHei",sans-serif;margin:0;padding:10px;background:#eef1f5}
  #log{white-space:pre-wrap;background:#fff;padding:10px;border:1px solid #c8ccd3;border-radius:6px}
  iframe{width:1200px;height:700px;border:1px solid #c8ccd3;margin-top:6px}
</style>
<div id="log">PROBE_BEGIN
</div>
<iframe id="fa" src="../.tmp/app.html"></iframe>
<script>
/* 主线 10：字体切换（内置 / 系统预设 / 自定义上传） */
var L = document.getElementById('log'), pass = 0, fail = 0;
function P(s){ L.textContent += s + '\n'; try{ fetch('/_report?d=' + encodeURIComponent(L.textContent)); }catch(e){} }
function ck(c, m){ if(c){ pass++; P('\u2713 ' + m); } else { fail++; P('\u2717 ' + m); } }
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
async function until(fn, ms){ var t0=Date.now(); while(Date.now()-t0<ms){ try{ if(fn()) return true; }catch(e){} await wait(80);} return false; }

(async function(){
 try{
  var fa = document.getElementById('fa');
  if(!await until(function(){ return fa.contentWindow.__T; }, 15000)) throw new Error('探针未就绪');
  var W = fa.contentWindow, D = W.document, T = W.__T;
  await wait(800);

  T.doOps([{ k:'clear' }]);
  await wait(400);
  T.doOps([{ k:'clear' }]);
  await wait(300);

  /* ---------- A. 内置字体可用 ---------- */
  ck(T.FONT_PRESETS.length >= 7, '预设字体 ' + T.FONT_PRESETS.length + ' 种');
  var hasBuiltin = T.FONT_PRESETS.some(function(p){ return p.k === 'noto'; });
  ck(hasBuiltin, '包含内置思源黑体（noto）');
  try{ await W.document.fonts.ready; }catch(e){}
  try{ await W.document.fonts.load('16px "WBNotoSC"'); }catch(e){}   // @font-face 惰性，先触发解析
  var okBuiltin = W.document.fonts.check('16px "WBNotoSC"');
  ck(okBuiltin, '内置字体可加载（document.fonts.check WBNotoSC=' + okBuiltin + '）');

  /* ---------- B. 新建元素带默认字体 ---------- */
  var n1 = T.addNote(300, 300, { text:'字体测试' });
  await wait(200);
  ck(T.doc.notes[n1.id].font === T.curFont, '新建便签带默认字体（' + T.doc.notes[n1.id].font + '）');

  /* ---------- C. 应用到选中便签 ---------- */
  T.sel.clear(); T.sel.add('n:' + n1.id);
  T.applyFont('kai');
  await wait(250);
  ck(T.doc.notes[n1.id].font === 'kai', '选中便签后切换楷体 → 字段已更新');
  var noteEl = D.querySelector('#notes .note[data-id="' + n1.id + '"] .note-text');
  var fam = noteEl ? noteEl.style.fontFamily : '';
  ck(/KaiTi|Kaiti|STKaiti/i.test(fam), '便签渲染使用楷体字体栈（' + fam.slice(0, 40) + '…）');

  /* ---------- D. 应用到选中文本 ---------- */
  var t1 = T.addText(700, 300, { text:'文本字体' });
  await wait(200);
  T.sel.clear(); T.sel.add('tx:' + t1.id);
  T.applyFont('song');
  await wait(250);
  ck(T.doc.texts[t1.id].font === 'song', '选中文本后切换宋体 → 字段已更新');
  var txEl = D.querySelector('#texts [data-id="' + t1.id + '"]');
  ck(txEl && /SimSun|Songti|Source Han Serif/i.test(txEl.style.fontFamily || ''),
     '文本元素渲染使用宋体字体栈（' + ((txEl && txEl.style.fontFamily) || '').slice(0, 40) + '…）');

  /* ---------- E. 应用到评论 ---------- */
  var c1 = T.addComment(500, 500);
  await wait(200);
  T.sel.clear(); T.sel.add('cm:' + c1.id);
  T.applyFont('mono');
  await wait(250);
  ck(T.doc.comments[c1.id].font === 'mono', '选中评论后切换等宽 → 字段已更新');

  /* ---------- F. 未选中时只改默认 ---------- */
  T.sel.clear();
  T.applyFont('hei');
  await wait(200);
  ck(T.curFont === 'hei', '无选中时切换 → 默认字体变为黑体');
  var n2 = T.addNote(950, 300, { text:'继承默认' });
  await wait(200);
  ck(T.doc.notes[n2.id].font === 'hei', '新便签继承新的默认字体（' + T.doc.notes[n2.id].font + '）');
  ck(T.doc.notes[n1.id].font === 'kai', '已有便签的字体不被默认值改写（仍为 kai）');

  /* ---------- G. 非法字体值被拒绝 ---------- */
  T.applyOp({ k:'note.update', id:n2.id, patch:{ font:'evil"><script>' }, ts:Date.now() }, true);
  await wait(150);
  ck(T.doc.notes[n2.id].font === 'hei', '非法字体值被清洗丢弃（仍为 hei）');

  /* ---------- H. 自定义字体上传 ---------- */
  var before = T.customFonts.length;
  var bytes = null;
  try{
    var styles = Array.prototype.slice.call(W.document.querySelectorAll('style'));
    for(var i=0;i<styles.length;i++){
      var txt = styles[i].textContent || '';
      if(txt.indexOf('WBNotoSC') < 0) continue;
      var m = /base64,([A-Za-z0-9+/=]+)/.exec(txt);
      if(m){ bytes = m[1]; break; }
    }
  }catch(e){}

  if(bytes){
    var bin = W.atob(bytes);
    var buf = new Uint8Array(bin.length);
    for(var k2=0;k2<bin.length;k2++) buf[k2] = bin.charCodeAt(k2);
    var file = new W.File([buf], '测试字体.woff', { type:'font/woff' });
    T.addCustomFont(file);
    var okAdd = await until(function(){ return T.customFonts.length > before; }, 12000);
    ck(okAdd, '上传字体文件后可加入自定义列表（' + T.customFonts.length + ' 个）');
    if(okAdd){
      var cf = T.customFonts[T.customFonts.length-1];
      var reg = W.document.fonts.check('16px "WBFont_' + cf.id + '"');
      ck(reg, '自定义字体已注册为 FontFace（' + cf.name + '）');
      T.sel.clear(); T.sel.add('n:' + n2.id);
      T.applyFont('u:' + cf.id);
      await wait(250);
      ck(T.doc.notes[n2.id].font === 'u:' + cf.id, '可把自定义字体应用到元素');
      var fEl = D.querySelector('#notes .note[data-id="' + n2.id + '"] .note-text');
      ck(fEl && (fEl.style.fontFamily || '').indexOf('WBFont_' + cf.id) >= 0, '元素渲染引用了该自定义字体');
      T.removeCustomFont(cf.id);
      await wait(400);
      ck(T.customFonts.length === before, '移除自定义字体后列表恢复');
    }
  } else {
    ck(false, '未能从样式表读取内嵌字体数据，自定义上传用例未执行');
  }

  /* ---------- I. 导出不报错且字体生效 ---------- */
  T.sel.clear(); T.requestDraw();
  var out = await T.renderExport();
  ck(!!out && out.W > 0 && out.H > 0, '导出渲染正常（' + (out && out.W) + '×' + (out && out.H) + '）');

 }catch(err){ fail++; P('\u2717 测试中断: ' + (err && err.message || err)); }
 P('== ' + pass + ' 通过 / ' + fail + ' 失败 ==');
 P('PROBE_END');
})();
</script>
